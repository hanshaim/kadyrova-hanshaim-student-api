spring.application.name=kadyrova-hanshaim-student-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${DB_USERNAME:studentuser}
spring.datasource.password=${DB_PASSWORD:studentpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always
